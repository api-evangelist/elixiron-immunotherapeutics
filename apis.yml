aid: elixiron-immunotherapeutics
name: Elixiron Immunotherapeutics
description: 'Elixiron Immunotherapeutics (Cayman) Limited is a clinical-stage biopharmaceutical
  company founded in 2017, with offices in Taipei, Taiwan and Cambridge, Massachusetts,
  developing precision immunotherapies for neuroinflammation, autoimmune disease and
  cancer. Its clinical pipeline is led by enrupatinib (EI-1071), a small-molecule CSF-1R
  inhibitor in development for Alzheimer''s disease and other neurodegenerative indications,
  and EI-001, a fully human anti-interferon-gamma monoclonal antibody in Phase 2 for
  vitiligo, alongside preclinical EI-012 (anti-CD36) and EI-220 (mRNA) oncology programs.
  The company publishes a corporate and investor-relations website only: there is no
  developer portal, public API, SDK, webhook surface or machine-readable specification
  of any kind on its own hosts.'
